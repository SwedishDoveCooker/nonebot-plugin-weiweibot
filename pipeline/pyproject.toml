[project]
name = "vvpipe"
version = "0.1.0"
description = "Index builder for the VV picture bot: fetch episodes, find the target face, OCR the burned-in subtitles, pack frames."
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "onnxruntime>=1.18",
    "rapidocr-onnxruntime>=1.3",
    "pillow>=10",
    "tokenizers>=0.19",
    "yt-dlp[default]>=2026.1.1",
]

[project.scripts]
vvpipe = "vvpipe.cli:main"

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vvpipe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]